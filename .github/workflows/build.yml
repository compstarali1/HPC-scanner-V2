name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - run: npm install
      - run: npx cap add android
      - name: Make app icon
        run: |
          mkdir -p assets
          convert www/img/app-icon.png -background '#0a0e1a' -alpha remove -alpha off -resize 1024x1024 -gravity center -extent 1024x1024 assets/icon-only.png
          npx capacitor-assets generate --android --iconBackgroundColor '#0a0e1a'
      - name: Add permissions
        run: sed -i 's#<application#<uses-permission android:name="android.permission.CAMERA" />\n<uses-permission android:name="android.permission.VIBRATE" />\n<application#' android/app/src/main/AndroidManifest.xml
      - run: npx cap sync android
      - run: cd android && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: hpc-scanner-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
