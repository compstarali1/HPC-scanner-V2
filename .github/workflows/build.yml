name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: |
          npm install
          pip install pillow

      - name: Create Android project
        run: npx cap add android

      - name: App icon, camera permission, black launch screen
        run: |
          python scripts/make_icons.py
          rm -rf android/app/src/main/res/mipmap-anydpi-v26
          sed -i 's#<application#<uses-permission android:name="android.permission.CAMERA" />\n    <uses-permission android:name="android.permission.VIBRATE" />\n    <uses-feature android:name="android.hardware.camera" android:required="false" />\n    <application#' android/app/src/main/AndroidManifest.xml
          sed -i 's#@drawable/splash#@android:color/black#g' android/app/src/main/res/values/styles.xml

      - name: Sync web files
        run: npx cap sync android

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
          mv app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/HPC-Scanner.apk

      - uses: actions/upload-artifact@v4
        with:
          name: HPC-Scanner-APK
          path: android/app/build/outputs/apk/debug/HPC-Scanner.apk
